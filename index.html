</head>

<body>

  <!-- Navbar -->
  <nav id="navbar">
    <div class="nav-left">
      <img src="https://i.ibb.co/8JWh91Z/Untitled-design.png" alt="My Star Plus" class="nav-logo">
      <div class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="search-container"
        style="display: flex; align-items: center; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 6px 12px; margin-right: 15px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          style="margin-right: 8px;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search titles..."
          style="background: transparent; border: none; outline: none; color: white; font-size: 0.9rem; width: 120px;">
      </div>
      <div class="user-icon" id="user-menu-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <!-- User Dropdown Menu -->
      <div class="user-dropdown" id="user-dropdown">
        <a href="index.html">Home</a>
        <a href="admin.html">Admin Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- Dynamic Hero Slider -->
  <header class="hero-slider-container" id="hero-slider" tabindex="0">
    <!-- Slides injected via JS -->
  </header>

  <!-- Main Content Rows -->
  <main class="main-content" id="main-content-area">

    <!-- Search Results Row (Hidden by default) -->
    <section class="content-row" id="search-section" style="display: none;">
      <h2 class="row-title">Search Results</h2>
      <div class="row-container">
        <button class="slider-btn left" onclick="slideRow('search-row', -300)">❮</button>
        <div class="row-inner custom-scrollbar" id="search-row">
          <!-- JS INJECTION -->
        </div>
        <button class="slider-btn right" onclick="slideRow('search-row', 300)">❯</button>
      </div>
    </section>

    <!-- Latest Uploads Row -->
    <section class="content-row" id="latest-section">
      <h2 class="row-title">Latest Uploads</h2>
      <div class="row-container">
        <button class="slider-btn left" onclick="slideRow('uploads-row', -300)">❮</button>
        <div class="row-inner custom-scrollbar" id="uploads-row">
          <!-- JS INJECTION -->
        </div>
        <button class="slider-btn right" onclick="slideRow('uploads-row', 300)">❯</button>
      </div>
    </section>

    <!-- Ad Banner Section -->
    <div id="promotional-ad-container" class="ad-banner-section" style="display: none;">
      <!-- JS INJECTION -->
    </div>

    <!-- Trending Row -->
    <section class="content-row" id="trending-section">
      <h2 class="row-title">Trending Now</h2>
      <div class="row-container">
        <button class="slider-btn left" onclick="slideRow('trending-row', -300)">❮</button>
        <div class="row-inner custom-scrollbar" id="trending-row">
          <!-- JS INJECTION -->
        </div>
        <button class="slider-btn right" onclick="slideRow('trending-row', 300)">❯</button>
      </div>
    </section>

  </main>

  <!-- Interstitial Ad Overlay -->
  <div class="interstitial-overlay" id="interstitial-ad">
    <!-- JS Injection -->
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="movie-modal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="forceCloseModal()">✕</button>
      <div class="modal-image">
        <img id="modal-img" src="" alt="">
      </div>
      <div class="modal-details">
        <span id="modal-category"></span>
        <h2 id="modal-title"></h2>
        <p>Watch this premium content now. Experience high quality cinematic storytelling directly on your device.</p>
        
        <div class="watch-actions" style="margin-bottom: 2rem;">
          <button class="action-btn btn-like" onclick="handleLike()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
            <span class="watch-like-count">0</span>
          </button>
          <button class="action-btn btn-dislike" onclick="handleDislike()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path></svg>
            <span class="watch-dislike-count">0</span>
          </button>
          <div class="reaction-picker">
            <button class="action-btn btn-reaction" onclick="toggleReactionMenu(this)">
              😀 React
            </button>
            <div class="reaction-menu">
              <button onclick="handleReaction('heart')">❤️ <span class="react-heart">0</span></button>
              <button onclick="handleReaction('laugh')">😂 <span class="react-laugh">0</span></button>
              <button onclick="handleReaction('wow')">😮 <span class="react-wow">0</span></button>
            </div>
          </div>
        </div>

        <a href="#" id="modal-link" target="_blank" class="btn-watch">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
            stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Watch Now
        </a>
      </div>
    </div>
  </div>

  <!-- Watch Video Overlay -->
  <div class="watch-overlay" id="watch-overlay">
    <div class="watch-container">
      <button class="watch-close" onclick="closeWatchOverlay()">✕</button>

      <div class="watch-video-section" id="watch-video-container">
        <!-- Iframe injected here -->
      </div>

      <div class="watch-info-section">
        <h1 class="watch-title" id="watch-title">Title</h1>

        <div class="watch-meta">
          <div class="watch-stats">
            <span id="watch-views">0 views</span> • <span id="watch-date">Date</span>
          </div>
          <div class="watch-actions">
            <button class="action-btn btn-like" onclick="handleLike()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path
                  d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3">
                </path>
              </svg>
              <span class="watch-like-count">0</span>
            </button>
            <button class="action-btn btn-dislike" onclick="handleDislike()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path
                  d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17">
                </path>
              </svg>
              <span class="watch-dislike-count">0</span>
            </button>
            <div class="reaction-picker">
              <button class="action-btn btn-reaction" onclick="toggleReactionMenu(this)">
                😀 React
              </button>
              <div class="reaction-menu">
                <button onclick="handleReaction('heart')">❤️ <span class="react-heart">0</span></button>
                <button onclick="handleReaction('laugh')">😂 <span class="react-laugh">0</span></button>
                <button onclick="handleReaction('wow')">😮 <span class="react-wow">0</span></button>
              </div>
            </div>
          </div>
        </div>

        <div class="watch-description">
          <p id="watch-desc">Description goes here...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
