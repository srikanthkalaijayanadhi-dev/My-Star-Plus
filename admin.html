<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - STARPLUS+</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Admin Login Overlay -->
  <div id="admin-login-overlay" style="position:fixed;inset:0;background:var(--bg-color);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <div class="admin-glass-panel" style="width:100%;max-width:400px;text-align:center;">
      <h2 style="margin-bottom:20px;">Admin Access</h2>
      <input type="password" id="admin-pwd-input" placeholder="Enter Password" style="width:100%;padding:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:white;margin-bottom:15px;outline:none;text-align:center;">
      <button onclick="checkAdminPassword()" class="btn-submit">Login</button>
      <p id="admin-pwd-error" style="color:#ef4444;font-size:0.8rem;margin-top:10px;display:none;">Incorrect Password.</p>
      <a href="index.html" style="display:inline-block;margin-top:20px;font-size:0.8rem;color:var(--text-muted);text-decoration:underline;">Return to Home</a>
    </div>
  </div>

  <!-- Navbar -->
  <nav id="navbar" class="scrolled">
    <div class="nav-left">
      <img src="https://i.ibb.co/8JWh91Z/Untitled-design.png" alt="My Star Plus" class="nav-logo">
    </div>
    <div class="nav-right">
      <a href="index.html" class="btn-secondary" style="padding: 8px 16px; font-size: 0.9rem;">View Site</a>
    </div>
  </nav>

  <!-- Admin Panel -->
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1 style="font-size: 2.5rem; margin-bottom: 8px;">Admin Panel</h1>
        <p style="color: var(--text-muted);">Manage your OTT platform content securely.</p>
      </div>
    </div>

    <div class="admin-grid">
      <!-- Upload Form -->
      <div class="admin-glass-panel">
        <h2 style="margin-bottom: 24px; font-size: 1.2rem;">Add New Title</h2>
        <form id="upload-form">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="upload-title" placeholder="e.g. Avengers: Endgame" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="upload-desc" placeholder="Content description..." rows="3" style="width:100%;padding:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:white;outline:none;resize:vertical;"></textarea>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="upload-category" placeholder="e.g. Action, Sci-Fi" required>
          </div>
          <div class="form-group">
            <label>Thumbnail Image URL (16:9 ratio)</label>
            <input type="url" id="upload-thumb" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Large Banner Image URL (Top Slider)</label>
            <input type="url" id="upload-banner" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Website Redirect Link</label>
            <input type="url" id="upload-video" placeholder="https://youtube.com/...">
          </div>
          <div class="form-group">
            <label>Embed Video Code (HTML iframe)</label>
            <textarea id="upload-embed" placeholder="<iframe...></iframe>" rows="3" style="width:100%;padding:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:white;outline:none;resize:vertical;"></textarea>
          </div>
          <div class="form-group">
            <label>Initial Views</label>
            <input type="number" id="upload-views" placeholder="e.g. 1000" value="0" required>
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="upload-isLatest" style="width: 20px; height: 20px;" checked>
            <label style="margin-bottom: 0;">Feature in Top Banner (isLatest)</label>
          </div>
          <button type="submit" class="btn-submit">Publish Content</button>
        </form>
      </div>

      <!-- Upload List -->
      <div class="admin-glass-panel">
        <h2 style="margin-bottom: 24px; font-size: 1.2rem;">Managed Uploads</h2>
        <div id="uploads-list">
          <p style="color: var(--text-muted); text-align: center; padding: 40px 0;">Loading uploads...</p>
        </div>
      </div>
    </div>

    <!-- Ad Management Header -->
    <div class="admin-header" style="margin-top: 3rem;">
      <div>
        <h2 style="font-size: 2rem; margin-bottom: 8px;">Ad Management</h2>
        <p style="color: var(--text-muted);">Manage promotional banners displayed on the homepage.</p>
      </div>
    </div>

    <!-- Ad Management Grid -->
    <div class="admin-grid">
      <!-- Ad Upload Form -->
      <div class="admin-glass-panel">
        <h2 style="margin-bottom: 24px; font-size: 1.2rem;">Add New Ad Banner</h2>
        <form id="ad-upload-form">
          <div class="form-group">
            <label>Ad Type</label>
            <select id="ad-type" style="width:100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; outline: none; margin-bottom: 15px;" onchange="toggleAdFields()">
              <option value="banner">Banner (Standard Image)</option>
              <option value="native">Native (Blends with Movies)</option>
              <option value="video">Video (Auto-playing Video)</option>
              <option value="interstitial">Interstitial (Full Screen Popup)</option>
            </select>
          </div>
          <div class="form-group" id="ad-title-group" style="display:none;">
            <label>Title (For Native/Interstitial Ads)</label>
            <input type="text" id="ad-title" placeholder="e.g. Sponsored Post">
          </div>
          <div class="form-group" id="ad-desc-group" style="display:none;">
            <label>Description (For Native/Interstitial Ads)</label>
            <input type="text" id="ad-desc" placeholder="Short description...">
          </div>
          <div class="form-group" id="ad-image-group">
            <label>Ad Image URL (Banner/Thumbnail)</label>
            <input type="url" id="ad-image" placeholder="https://...">
          </div>
          <div class="form-group" id="ad-video-group" style="display:none;">
            <label>Ad Video URL (.mp4 format)</label>
            <input type="url" id="ad-video" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Ad Redirect URL (Link)</label>
            <input type="url" id="ad-link" placeholder="https://..." required>
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="ad-isActive" style="width: 20px; height: 20px;" checked>
            <label style="margin-bottom: 0;">Is Active</label>
          </div>
          <button type="submit" class="btn-submit">Publish Ad</button>
        </form>

        <script>
        function toggleAdFields() {
          const type = document.getElementById('ad-type').value;
          document.getElementById('ad-title-group').style.display = (type === 'native' || type === 'interstitial') ? 'block' : 'none';
          document.getElementById('ad-desc-group').style.display = (type === 'native' || type === 'interstitial') ? 'block' : 'none';
          document.getElementById('ad-video-group').style.display = (type === 'video') ? 'block' : 'none';
          document.getElementById('ad-image-group').style.display = (type === 'video') ? 'none' : 'block';
        }
        </script>
      </div>

      <!-- Ad List -->
      <div class="admin-glass-panel">
        <h2 style="margin-bottom: 24px; font-size: 1.2rem;">Active Ads</h2>
        <div id="ads-list">
          <p style="color: var(--text-muted); text-align: center; padding: 40px 0;">Loading ads...</p>
        </div>
      </div>
    </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
